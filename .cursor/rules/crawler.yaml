name: "Python Crawler Rules"
description: "Rules for lotus_crawler python module"

ignore:
  - "tools/lotus_crawler/.venv/"
  - "tools/lotus_crawler/venv/"
  - "tools/lotus_crawler/__pycache__/"
  - "tools/lotus_crawler/logs/"
  - "tools/lotus_crawler/temp/"

rules:
  - pattern: "tools/lotus_crawler/**/*.py"
    ai_role: >
      You are a Senior Python Developer.
      Optimize crawling architecture, use async if needed.
      Never read or use .env values. Keep crawler modular.
