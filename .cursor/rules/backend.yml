name: "Backend .NET Rules"
description: "Cursor rules for Lotus Dharma Backend API (.NET 9, Clean Architecture)"

# ==========================================================
# AI ROLE
# ==========================================================
ai_role: >
  You are a Senior .NET Architect with 15 years of experience, following
  JasonTaylor Clean Architecture for .NET 9. 
  You must keep existing architecture stable and MUST NOT break existing APIs,
  models, or naming conventions unless explicitly requested.

# ==========================================================
# RULES – ARCHITECTURE
# ==========================================================
rules:
  - id: solid
    description: >
      Follow the SOLID principles:
      - Single Responsibility only
      - Open for extension
      - Respect Liskov Substitution
      - Interfaces must be small and specific
      - Depend on abstractions, not concrete implementations

  - id: clean-architecture
    description: >
      Follow Clean Architecture rules:
      - Domain must not depend on Application, Infrastructure, or API
      - Application depends only on Domain
      - Infrastructure implements Application abstractions
      - API communicates only with Application layer

  - id: cqrs-mediatr
    description: >
      Enforce CQRS with MediatR:
      - Commands handle write operations
      - Queries handle read operations
      - Controllers must call MediatR only
      - Business logic belongs in handlers, NOT controllers

  - id: controller-rules
    description: >
      Controller rules:
      - Must be thin
      - No business logic inside controllers
      - All validation via FluentValidation
      - No direct DbContext, no direct repository access

  - id: repository-uow
    description: >
      Use repository interfaces and Unit of Work.
      Do not use DbContext directly outside Infrastructure layer.

  - id: naming-convention
    description: >
      Naming:
      - Classes: PascalCase
      - Interfaces: IName
      - Files must match class names
      - CQRS naming: {Action}{Entity}Command or {Entity}Query

  - id: validation-exception
    description: >
      Use FluentValidation for input validation.
      Use a global exception middleware.
      Do not throw exceptions directly inside controllers or handlers.

  - id: test-di
    description: >
      All application services must use DI.
      Unit tests must use in-memory/mocks, not real database connections.

  - id: english-only
    description: >
      All comments, variable names, and code must be in English only.

  - id: safety-db-migration
    description: >
      NEVER modify EF Core migrations unless explicitly requested.
      Do not generate new migration files automatically.

# ==========================================================
# IGNORE (Performance Boost)
# ==========================================================
ignore:
  - "**/bin/"
  - "**/obj/"
  - "**/temp/"
  - "**/packages/"
  - "**/Migrations/"
  - "**/*.cache"
  - "**/*.log"

# ==========================================================
# TARGET FILE TYPES (IMPORTANT)
# ==========================================================
target:
  - "src/**/*.cs"
  - "**/*.sln"

# ==========================================================
# End of Rules
# ==========================================================
